<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Grid: Core Archive</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#090d16">

    <script>
        // Registrazione del Service Worker per l'installazione su smartphone
        if ('service worker' in navigator) {
          navigator.serviceWorker.register('sw.js')
            .then(() => console.log("Service Worker: Sistema di caching attivato."))
            .catch(err => console.error("Anomalia Service Worker:", err));
        }
    </script>
    <style>
        /* --- STILI SCHERMATA DI LOGIN --- */
#login-screen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: #000000;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999; /* Sta sempre in primo piano */
  transition: opacity 0.5s ease;
}

.login-container {
  background-color: #090d16;
  border: 1px solid #00ffff;
  padding: 40px;
  border-radius: 8px;
  text-align: center;
  width: 90%;
  max-width: 400px;
  box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
}

.login-title {
  color: #00ffff;
  font-family: monospace;
  font-size: 2rem;
  margin-bottom: 5px;
  letter-spacing: 2px;
}

.login-subtitle {
  color: #555555;
  font-family: monospace;
  font-size: 0.9rem;
  margin-bottom: 30px;
}

#login-email, #login-password {
  width: 100%;
  padding: 12px;
  margin-bottom: 15px;
  background-color: #000000;
  border: 1px solid #333333;
  color: #ffffff;
  font-family: monospace;
  box-sizing: border-box;
}

#login-email:focus, #login-password:focus {
  border-color: #00ffff;
  outline: none;
}

#login-btn {
  width: 100%;
  padding: 12px;
  background-color: transparent;
  color: #00ffff;
  border: 1px solid #00ffff;
  font-family: monospace;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.3s ease;
}

#login-btn:hover {
  background-color: #00ffff;
  color: #000000;
}

.error-text {
  color: #ff0044;
  margin-top: 15px;
  font-family: monospace;
  font-size: 0.85rem;
  min-height: 20px;
}
        :root {
            --bg-pure: #000000;
            --surface-tech: #090d16;
            --surface-card: #101726;
            --accent-cyan: #00e5ff;
            --accent-orange: #ff6d00;
            --accent-green: #00ff00;
            --accent-vector: #1a293d;
            --text-neon: #e0f7fa;
            --text-dark: #6272a4;

            --cls-azione: #ff0055;
            --cls-fantascienza: #00e5ff;
            --cls-horror: #9d00ff;
            --cls-thriller: #ffea00;
            --cls-drammatico: #00ff66;
            --cls-commedia: #ff00ff;
            --cls-documentari: #00ffff;
            --cls-anime: #ffaa00;
            --cls-classici: #ffffff;
            --cls-serietv: #0088ff;

            /* Nodi Classificativi Estesi */
            --cls-romantico: #ff3399;
            --cls-giallo: #d4ff00;
            --cls-storico: #a0c4ff;
            --cls-avventura: #ff9933;
            --cls-fantasy: #c266ff;
            --cls-musicale: #ff4da6;
            --cls-guerra: #8f9779;
            --cls-western: #b87333;
            --cls-noir: #808080;
            --cls-biografico: #00ffaa;
            --cls-antologico: #00e1ff;
            --cls-satirico: #ccff00;
            --cls-investigativo: #0066ff;
            --cls-psicologico: #df00ff;
            --cls-distopico: #ff0055;
            --cls-cyberpunk: #ff007f;
            --cls-artimarziali: #ff2a00;
            --cls-sportivo: #ff5500;
            --cls-cult: #6e00ff;
            --cls-soprannaturale: #00ff44;
            --cls-spionaggio: #00ff77;
            --cls-sentimentale: #ff66b2;
            --cls-fantastico: #ffcc00;
            --cls-survival: #ff5e3a;
            --cls-animazione: #00ebff;
            --cls-catastrofico: #ff7300;
            --cls-supereroi: #00aaff;
            --cls-steampunk: #df7a00;
            --cls-mistero: #9d00ff;
            --cls-epico: #ffaa00;
            --cls-poliziesco: #0088ff;
            --cls-apocalittico: #00ff33;
            --cls-postapocalittico: #8c9eff;
            --cls-splatter: #b30000;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace, sans-serif; }

        body {
            background-color: var(--bg-pure);
            background-image:
                linear-gradient(rgba(0, 229, 255, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.15) 1px, transparent 1px);
            background-size: 35px 35px;
            color: var(--text-neon);
            padding: 15px;
            padding-bottom: 90px;
        }

        #bg-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; }

        .main-header {
            text-align: center; padding: 20px 0; margin-bottom: 25px;
            border-bottom: 1px solid var(--accent-vector); background: rgba(9, 13, 22, 0.6);
            box-shadow: 0 4px 20px rgba(0, 229, 255, 0.1);
        }

        .header-container { display: inline-block; vertical-align: middle; }
        .header-title {
            display: inline-block; vertical-align: middle; font-size: 1.3rem; font-weight: 900;
            letter-spacing: 2px; text-transform: uppercase; color: #ffffff;
            text-shadow: 0 0 10px var(--accent-cyan), 0 0 20px rgba(0, 229, 255, 0.5); margin: 0 15px;
        }
        .lightcycle-icon { display: inline-block; vertical-align: middle; width: 70px; height: 30px; }

        .nav-grid { display: table; width: 100%; margin-bottom: 25px; border: 1px solid var(--accent-cyan); box-shadow: 0 0 10px rgba(0, 229, 255, 0.2); }
        .nav-tab {
            display: table-cell; text-align: center; padding: 15px; cursor: pointer;
            background: var(--surface-tech); font-weight: bold; letter-spacing: 2px;
            text-transform: uppercase; font-size: 0.9rem; color: var(--text-dark); transition: all 0.3s ease;
        }
        .nav-tab.active { color: var(--bg-pure); background: var(--accent-cyan); text-shadow: none; box-shadow: 0 0 15px var(--accent-cyan); }

        .view-section { display: none; animation: fadeIn 0.4s ease forwards; }
        .view-section.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .tech-panel {
            background: rgba(9, 13, 22, 0.9); backdrop-filter: blur(5px);
            border: 1px solid var(--accent-vector); padding: 20px; position: relative;
            box-shadow: inset 0 0 15px rgba(0, 229, 255, 0.05);
        }
        .tech-panel::before {
            content: ''; position: absolute; top: -1px; left: -1px; width: 10px; height: 10px;
            border-top: 2px solid var(--accent-cyan); border-left: 2px solid var(--accent-cyan);
        }

        .form-group { margin-bottom: 18px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media(max-width: 600px) { .form-row { grid-template-columns: 1fr; } }

        label {
            display: block; font-size: 0.8rem; color: var(--accent-cyan); margin-bottom: 8px;
            text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 5px rgba(0, 229, 255, 0.4);
        }
        input[type="text"], input[type="email"], input[type="password"], textarea, select {
            width: 100%; padding: 12px; background: var(--bg-pure); border: 1px solid var(--accent-vector);
            color: var(--text-neon); font-size: 1rem;
        }
        input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent-cyan); box-shadow: 0 0 8px rgba(0, 229, 255, 0.3); }

        .cropper-container {
            width: 100%; border: 1px dashed var(--accent-cyan); background: #000;
            position: relative; overflow: hidden; margin-top: 10px; display: none;
            cursor: grab;
        }
        .cropper-container:active { cursor: grabbing; }
        #previewCanvas { display: block; margin: 0 auto; max-width: 100%; height: auto; }
        .cropper-hint {
            position: absolute; bottom: 5px; left: 0; width: 100%; text-align: center;
            font-size: 0.7rem; color: var(--bg-pure); background: rgba(0, 229, 255, 0.7); padding: 4px 0;
            pointer-events: none; font-weight: bold;
        }

        .genre-selector-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; background: var(--bg-pure); padding: 10px; border: 1px solid var(--accent-vector); }
        .genre-checkbox-label { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; text-transform: uppercase; cursor: pointer; color: var(--text-neon); }

        .btn-action {
            width: 100%; padding: 15px; background: rgba(0,0,0,0.5); border: 1px solid var(--accent-orange);
            color: var(--accent-orange); font-weight: bold; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: all 0.3s; margin-top: 10px;
        }
        .btn-action:hover { background: var(--accent-orange); color: var(--bg-pure); box-shadow: 0 0 20px rgba(255, 109, 0, 0.6); }
        .btn-cancel { border-color: var(--text-dark); color: var(--text-dark); margin-top: 5px; }
        .btn-cancel:hover { background: var(--text-dark); box-shadow: none; }

        .search-container { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .filters-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .sort-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 5px; }
        @media(max-width: 600px) { .filters-grid, .sort-grid { grid-template-columns: 1fr; } }

        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        .movie-card {
            background: rgba(16, 23, 38, 0.9); border: 1px solid var(--accent-vector); position: relative;
            display: flex; flex-direction: column; overflow: hidden; backdrop-filter: blur(3px);
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
        }
        .movie-card:hover { transform: translateY(-5px); box-shadow: 0 5px 20px rgba(0, 229, 255, 0.2); border-color: var(--accent-cyan); }
        .movie-card.blu-ray { border-top: 4px solid var(--accent-cyan); }
        .movie-card.dvd { border-top: 4px solid var(--accent-orange); }
        /* Stile Raggruppatore - Linea Verde */
        .movie-card.collection { border-top: 4px solid var(--accent-green); }

        /* Animazione a cascata per i film dentro i raggruppatori */
        .stagger-card {
            opacity: 0;
            transform: translateY(60px);
            animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(60px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .cover-display {
            width: 100%; height: 260px; background: #05080f; background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 100% 10px; display: flex; align-items: center; justify-content: center;
            color: var(--text-dark); font-size: 0.7rem; text-transform: uppercase; object-fit: cover;
        }
        .card-info { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .movie-title { font-weight: bold; font-size: 0.9rem; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; line-height: 1.3; color: #ffffff; }
        .movie-meta-short { font-size: 0.7rem; color: var(--text-dark); margin-bottom: 6px; }
        .genres-container { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
        .genre-tag { font-size: 0.65rem; font-weight: bold; text-transform: uppercase; }

        .card-actions { position: absolute; top: 5px; right: 5px; display: flex; gap: 5px; z-index: 5; }
        .icon-btn { background: rgba(0,0,0,0.8); width: 28px; height: 28px; border-radius: 4px; cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; transition: all 0.2s; font-family: sans-serif; }
        .edit-btn { border: 1px solid var(--accent-cyan); color: var(--accent-cyan); }
        .delete-btn { border: 1px solid #ff5555; color: #ff5555; }
        .icon-btn:hover { background: var(--surface-tech); }

        .detail-header { position: relative; margin-bottom: 20px; border: 1px solid var(--accent-cyan); box-shadow: 0 0 20px rgba(0,229,255,0.2); background-color: #000; }
        .detail-header.collection-header { border-color: var(--accent-green); box-shadow: 0 0 20px rgba(0,255,0,0.2); }
        .detail-cover { width: 100%; max-height: 600px; object-fit: contain; display: block; opacity: 0.85; margin: 0 auto; }
        .detail-title-overlay { position: absolute; bottom: 0; left: 0; width: 100%; padding: 30px 20px 20px 20px; background: linear-gradient(transparent, #000 80%); }
        .detail-title { font-size: 2rem; color: #fff; text-shadow: 0 0 15px var(--accent-cyan); text-transform: uppercase; letter-spacing: 2px; }
        .detail-header.collection-header .detail-title { text-shadow: 0 0 15px var(--accent-green); }
        .detail-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        @media(max-width: 768px) { .detail-grid { grid-template-columns: 1fr; } }
        .data-panel { border-left: 3px solid var(--accent-cyan); padding-left: 15px; margin-bottom: 20px; }
        .data-panel h3 { font-size: 0.8rem; color: var(--text-dark); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; }
        .data-panel p { color: #fff; font-size: 1rem; line-height: 1.5; white-space: pre-wrap; }
        .data-panel.plot-panel p { font-size: 0.95rem; color: var(--text-neon); text-align: justify; }

        .backup-zone { margin-bottom: 20px; padding: 15px; border: 1px solid var(--accent-vector); display: flex; gap: 10px; background: rgba(9, 13, 22, 0.8); }
        .btn-secondary { flex: 1; padding: 10px; background: var(--surface-tech); border: 1px solid var(--text-dark); color: var(--text-neon); font-size: 0.7rem; cursor: pointer; text-transform: uppercase; }

        .cb-collection-row { display:flex; align-items:center; gap:12px; background:var(--surface-card); padding:12px; border:1px solid var(--accent-vector); cursor:pointer; margin-bottom: 8px; transition: 0.2s; }
        .cb-collection-row:hover { border-color: var(--accent-cyan); }
    </style>
</head>
<body>
<div id="login-screen">
    <div class="login-container">
        <h1 class="login-title">THE GRID</h1>
        <p class="login-subtitle">IDENTIFICAZIONE RICHIESTA</p>

        <input type="email" id="login-email" placeholder="Email di accesso" required>
        <input type="password" id="login-password" placeholder="Password di decrittazione" required>

        <button id="login-btn">INIZIALIZZA CONNESSIONE</button>
        <p id="login-error" class="error-text"></p>
    </div>
</div>
<canvas id="bg-canvas"></canvas>

<header class="main-header">
    <div class="header-container">
        <div class="lightcycle-icon">
            <svg width="70" height="30" viewBox="0 0 70 30">
                <path d="M5 20 L40 20" stroke="var(--accent-cyan)" stroke-width="4" opacity="0.8" />
                <path d="M15 17 L38 17" stroke="var(--accent-cyan)" stroke-width="1" opacity="0.5" />
                <path d="M35 22 C38 14, 48 10, 58 14 L64 22 Z" fill="#05080f" stroke="var(--accent-cyan)" stroke-width="2" />
                <circle cx="40" cy="21" r="5" fill="#000" stroke="var(--accent-cyan)" stroke-width="2" />
                <circle cx="60" cy="21" r="5" fill="#000" stroke="var(--accent-cyan)" stroke-width="2" />
                <circle cx="40" cy="21" r="2" fill="var(--accent-cyan)" />
                <circle cx="60" cy="21" r="2" fill="var(--accent-cyan)" />
            </svg>
        </div>
        <h1 class="header-title">The Grid: Core Archive</h1>
        <div class="lightcycle-icon">
            <svg width="70" height="30" viewBox="0 0 70 30" style="transform: scaleX(-1);">
                <path d="M5 20 L40 20" stroke="var(--accent-cyan)" stroke-width="4" opacity="0.8" />
                <path d="M15 17 L38 17" stroke="var(--accent-cyan)" stroke-width="1" opacity="0.5" />
                <path d="M35 22 C38 14, 48 10, 58 14 L64 22 Z" fill="#05080f" stroke="var(--accent-cyan)" stroke-width="2" />
                <circle cx="40" cy="21" r="5" fill="#000" stroke="var(--accent-cyan)" stroke-width="2" />
                <circle cx="60" cy="21" r="5" fill="#000" stroke="var(--accent-cyan)" stroke-width="2" />
                <circle cx="40" cy="21" r="2" fill="var(--accent-cyan)" />
                <circle cx="60" cy="21" r="2" fill="var(--accent-cyan)" />
            </svg>
        </div>
    </div>
</header>

<div class="nav-grid" id="mainNav">
    <div class="nav-tab active" id="tab-catalog" onclick="switchView('catalog')">Archivio Database</div>
    <div class="nav-tab" id="tab-add" onclick="switchView('add')">Uplink Nuovo Dato</div>
</div>

<div id="section-catalog" class="view-section active">
    <div class="backup-zone" id="backupZone">
        <button class="btn-secondary" onclick="exportDatabase()">Esporta Disco Backup</button>
        <button class="btn-secondary" onclick="document.getElementById('importFile').click()">Importa Disco Backup</button>
        <input type="file" id="importFile" style="display:none" onchange="importDatabase(this)">
    </div>

    <div class="search-container">
        <input type="text" id="searchBar" placeholder="Cerca nel Titolo..." oninput="renderMovies()">
        <div class="filters-grid">
            <input type="text" id="filterDirector" placeholder="Cerca Regista..." oninput="renderMovies()">
            <input type="text" id="filterActors" placeholder="Cerca Attori..." oninput="renderMovies()">
            <input type="text" id="filterYear" placeholder="Anno Uscita..." oninput="renderMovies()">
            <input type="text" id="filterSpecs" placeholder="Dati Tecnici / Descrizione..." oninput="renderMovies()">
            <select id="filterFormat" onchange="renderMovies()">
                <option value="ALL">// Formato / Tipologia: Tutti</option>
                <option value="Blu-ray">Blu-ray</option>
                <option value="DVD">DVD</option>
                <option value="Collection">Raggruppatori (Collezioni)</option>
            </select>
            <select id="filterGenre" onchange="renderMovies()">
                <option value="ALL">// Genere Matrice: Tutti</option>
            </select>
        </div>
        <div class="sort-grid">
            <select id="sortCriteria" onchange="renderMovies()">
                <option value="alpha">// Ordina per: Alfabetico</option>
                <option value="added">// Ordina per: Data Inserimento</option>
                <option value="modified">// Ordina per: Ultima Modifica</option>
            </select>
            <select id="sortDirection" onchange="renderMovies()">
                <option value="asc">▶ Direzione: Crescente (A-Z / Dal più vecchio)</option>
                <option value="desc">▼ Direzione: Decrescente (Z-A / Dal più recente)</option>
            </select>
        </div>
    </div>
    <div class="movie-grid" id="movieGrid"></div>
</div>

<div id="section-add" class="view-section">
    <div class="tech-panel">

        <div class="form-group" style="border-bottom: 1px solid var(--accent-vector); padding-bottom: 15px;">
            <label style="color: var(--accent-green);">Tipologia di Archiviazione</label>
            <select id="itemType" onchange="toggleFormFields()">
                <option value="movie">Flusso Singolo (Film Classico)</option>
                <option value="collection">Raggruppatore (Collezione/Saga)</option>
            </select>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Identificativo (Titolo)</label>
                <input type="text" id="movieTitle" placeholder="Titolo...">
            </div>
            <div class="form-group" id="blockYear">
                <label>Anno di Uscita</label>
                <input type="text" id="movieYear" placeholder="Es. 2010">
            </div>
        </div>

        <div id="movieOnlyFields">
            <div class="form-row">
                <div class="form-group">
                    <label>Regista Creatore</label>
                    <input type="text" id="movieDirector" placeholder="Nome regista...">
                </div>
                <div class="form-group">
                    <label>Formato Disco</label>
                    <select id="movieFormat">
                        <option value="Blu-ray">Blu-ray</option>
                        <option value="DVD">DVD</option>
                    </select>
                </div>
            </div>

            <div class="form-group" id="movieGroupSelectContainer">
                <label style="color: var(--accent-green);">Associazione Raggruppatore (Opzionale)</label>
                <select id="movieGroupSelect">
                    <option value="">// Nessun Raggruppatore (Resta nel Mainframe Generale)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Programmi (Attori Principali)</label>
                <input type="text" id="movieActors" placeholder="Attori separati da virgola...">
            </div>
        </div>
        <div class="form-group">
            <label id="lblSpecs">Specifiche Tecniche / Nerd Info</label>
            <input type="text" id="movieSpecs" placeholder="Informazioni o Descrizione Raggruppatore...">
        </div>

        <div id="movieOnlyFieldsBottom">
            <div class="form-group">
                <label>Classificazione Matrice (Generi)</label>
                <div class="genre-selector-grid" id="genreSelectorGrid"></div>
            </div>

            <div class="form-group">
                <label>Sinossi / Trama del Flusso</label>
                <textarea id="moviePlot" rows="5" placeholder="Inserisci i dati della trama qui..."></textarea>
            </div>

            <div class="form-group">
                <label>Coordinate Scaffale (Note Interne)</label>
                <input type="text" id="movieNotes" placeholder="Es. Scaffale A, Posizione 3">
            </div>
        </div>

        <div class="form-group">
            <label>Acquisizione Ottica HD (Risoluzione: 672x960)</label>
            <input type="file" id="movieCover" accept="image/*" onchange="initImageCrop(this)">
            <div class="cropper-container" id="cropperUI">
                <canvas id="previewCanvas"></canvas>
                <div class="cropper-hint">TRASCINA PER RIPOSIZIONARE - ROTELLINA MOUSE PER ZOOM</div>
            </div>
        </div>

        <button id="submitBtn" class="btn-action" onclick="saveMovie()">Sincronizza nel Core</button>
        <button id="cancelBtn" class="btn-action btn-cancel" style="display:none;" onclick="cancelEdit()">Interrompi Modifica</button>
    </div>
</div>

<div id="section-detail" class="view-section">
    <button class="btn-action btn-cancel" style="margin-bottom: 20px;" onclick="goBackFromDetail()">← Ritorna Indietro</button>
    <div class="tech-panel" id="detailContent" style="padding: 0; overflow: hidden;">
    </div>
</div>

<div id="section-collection-view" class="view-section">
    <button class="btn-action btn-cancel" style="margin-bottom: 20px;" onclick="switchView('catalog')">← Ritorna all'Archivio</button>
    <div class="tech-panel" style="padding: 0; overflow: hidden; margin-bottom: 20px;" id="collectionHeaderContent">

<script>
    // --- MOTORE DATI (Unificato: Film e Raggruppatori nello stesso DB) ---
    window.moviesDB = [];

    let currentCollectionId = null;

    // Array temporaneo usato durante la gestione (checkbox) della collezione

    // Ricalcolo del core generi

        "Documentari": "var(--cls-documentari)", "Anime": "var(--cls-anime)", "Classici": "var(--cls-classici)",
        "Serie TV": "var(--cls-serietv)", "Romantico": "var(--cls-romantico)", "Giallo": "var(--cls-giallo)",
        "Storico": "var(--cls-storico)", "Avventura": "var(--cls-avventura)", "Fantasy": "var(--cls-fantasy)",
        "Musicale": "var(--cls-musicale)", "Guerra": "var(--cls-guerra)", "Western": "var(--cls-western)",
        "Noir": "var(--cls-noir)", "Biografico": "var(--cls-biografico)", "Antologico": "var(--cls-antologico)",
        "Satirico": "var(--cls-satirico)", "Investigativo": "var(--cls-investigativo)", "Psicologico": "var(--cls-psicologico)",
        "Distopico": "var(--cls-distopico)", "Cyberpunk": "var(--cls-cyberpunk)", "Arti Marziali": "var(--cls-artimarziali)",
        "Sportivo": "var(--cls-sportivo)", "Cult": "var(--cls-cult)", "Soprannaturale": "var(--cls-soprannaturale)",
        "Spionaggio": "var(--cls-spionaggio)", "Sentimentale": "var(--cls-sentimentale)", "Fantastico": "var(--cls-fantastico)",
        "Survival": "var(--cls-survival)", "Animazione": "var(--cls-animazione)", "Catastrofico": "var(--cls-catastrofico)",
        "Supereroi": "var(--cls-supereroi)", "Steampunk": "var(--cls-steampunk)", "Mistero": "var(--cls-mistero)",

    };

    // --- SISTEMA CROPPER IMMAGINE HD ---
    let rawImage = null; let cropX = 0, cropY = 0; let isDragging = false, startDragX = 0, startDragY = 0;
    let scaledW = 0, scaledH = 0; let currentScale = 1, minScale = 1;
    const previewCanvas = document.getElementById('previewCanvas'); const pCtx = previewCanvas.getContext('2d');
    const CANVAS_WIDTH = 672; const CANVAS_HEIGHT = 960; previewCanvas.width = CANVAS_WIDTH; previewCanvas.height = CANVAS_HEIGHT;

    function initImageCrop(input) {
        const file = input.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            rawImage = new Image();
            rawImage.onload = function() {
                document.getElementById('cropperUI').style.display = 'block'; cropX = 0; cropY = 0;
                minScale = Math.max(CANVAS_WIDTH / rawImage.width, CANVAS_HEIGHT / rawImage.height); currentScale = minScale;
                scaledW = rawImage.width * currentScale; scaledH = rawImage.height * currentScale;
                cropX = (CANVAS_WIDTH - scaledW) / 2; cropY = (CANVAS_HEIGHT - scaledH) / 2; renderCrop();
            };
            rawImage.src = e.target.result;
        }; reader.readAsDataURL(file);
    }

    function renderCrop() {
        if(!rawImage) return;
        pCtx.clearRect(0,0, CANVAS_WIDTH, CANVAS_HEIGHT);
        cropX = Math.min(0, Math.max(CANVAS_WIDTH - scaledW, cropX)); cropY = Math.min(0, Math.max(CANVAS_HEIGHT - scaledH, cropY));
        pCtx.drawImage(rawImage, cropX, cropY, scaledW, scaledH);
        currentBase64Cover = previewCanvas.toDataURL('image/jpeg', 0.8);
    }

    function startDrag(e) { if(!rawImage) return; isDragging = true; startDragX = e.clientX || e.touches[0].clientX; startDragY = e.clientY || e.touches[0].clientY; }
    function doDrag(e) { if(!isDragging) return; e.preventDefault(); const currentX = e.clientX || e.touches[0].clientX; const currentY = e.clientY || e.touches[0].clientY; cropX += (currentX - startDragX); cropY += (currentY - startDragY); startDragX = currentX; startDragY = currentY; renderCrop(); }
    function stopDrag() { isDragging = false; }
    function doZoom(e) { if(!rawImage) return; e.preventDefault(); const zoomSpeed = 0.05; const zoomAmount = e.deltaY < 0 ? zoomSpeed : -zoomSpeed; const oldW = scaledW; const oldH = scaledH; currentScale += zoomAmount; currentScale = Math.max(minScale, currentScale); scaledW = rawImage.width * currentScale; scaledH = rawImage.height * currentScale; cropX -= (scaledW - oldW) / 2; cropY -= (scaledH - oldH) / 2; renderCrop(); }

    previewCanvas.addEventListener('mousedown', startDrag); window.addEventListener('mousemove', doDrag); window.addEventListener('mouseup', stopDrag);
    previewCanvas.addEventListener('touchstart', startDrag); window.addEventListener('touchmove', doDrag, {passive: false}); window.addEventListener('touchend', stopDrag);
    previewCanvas.addEventListener('wheel', doZoom, {passive: false});

    // --- MOTORE GRAFICO BACKGROUND (Aggiornato per transizioni morbide fuori schermo) ---
    function initGridAnimation() {
        const canvas = document.getElementById('bg-canvas'); const ctx = canvas.getContext('2d'); let width, height; const GRID_SIZE = 35;
        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; } window.addEventListener('resize', resize); resize();
        class Cycle {
            constructor(colorHex) { this.baseColor = colorHex; this.color = colorHex; this.reset(window.scrollY); }
            reset(scrollY = window.scrollY) {
                // Generazione casuale (8%) per la Lightcycle Verde
                this.color = (Math.random() < 0.08) ? '#00ff66' : this.baseColor;

                const w = window.innerWidth; const h = window.innerHeight; this.x = Math.floor(Math.random() * (w / GRID_SIZE)) * GRID_SIZE;
                const startGridY = Math.floor(scrollY / GRID_SIZE) - 2; const visibleGridsY = Math.ceil(h / GRID_SIZE) + 4;
                this.y = (startGridY + Math.floor(Math.random() * visibleGridsY)) * GRID_SIZE;
                const maxDocHeight = Math.max(document.body.scrollHeight, h); if (this.y < 0) this.y = 0; if (this.y > maxDocHeight) this.y = Math.floor(maxDocHeight / GRID_SIZE) * GRID_SIZE;
                const dirs = [[1,0], [-1,0], [0,1], [0,-1]]; const d = dirs[Math.floor(Math.random() * dirs.length)]; this.dx = d[0]; this.dy = d[1]; this.history = []; this.maxLength = Math.floor(Math.random() * 60) + 40;
            }
            update(scrollY = window.scrollY) {
                const w = window.innerWidth; const h = window.innerHeight; const maxDocHeight = Math.max(document.body.scrollHeight, h);
                if (this.x % GRID_SIZE === 0 && this.y % GRID_SIZE === 0) { if (Math.random() < 0.25) { if (this.dx !== 0) { this.dx = 0; this.dy = Math.random() < 0.5 ? 1 : -1; } else { this.dx = Math.random() < 0.5 ? 1 : -1; this.dy = 0; } } }
                this.x += this.dx * 1; this.y += this.dy * 1; if (this.x % 3 === 0 || this.y % 3 === 0) { this.history.push({x: this.x, y: this.y}); if (this.history.length > this.maxLength) this.history.shift(); }

                // MARGINE OFF-SCREEN: La moto supera ampiamente il bordo, permettendo alla scia di seguirla e sparire in modo naturale
                const margin = 500;
                if (this.x < -margin || this.x > w + margin || this.y < scrollY - margin || this.y > scrollY + h + margin) { this.reset(scrollY); }
            }
            draw(ctx, scrollY = window.scrollY) {
                if (this.history.length < 2) return;
                for(let i=0; i<this.history.length-1; i++) { ctx.beginPath(); ctx.moveTo(this.history[i].x, this.history[i].y - scrollY); ctx.lineTo(this.history[i+1].x, this.history[i+1].y - scrollY); ctx.strokeStyle = this.color; ctx.globalAlpha = i / this.history.length; ctx.lineWidth = 2; if (i === this.history.length - 2) { ctx.shadowBlur = 10; ctx.shadowColor = this.color; } else { ctx.shadowBlur = 0; } ctx.stroke(); }
                ctx.globalAlpha = 1.0; ctx.shadowBlur = 8; ctx.shadowColor = this.color; const screenX = this.x; const screenY = this.y - scrollY;
                ctx.fillStyle = "#ffffff"; ctx.beginPath(); if (this.dx !== 0) { ctx.roundRect(screenX - 9, screenY - 3, 18, 6, 3); } else { ctx.roundRect(screenX - 3, screenY - 9, 6, 18, 3); } ctx.fill(); ctx.shadowBlur = 0;
            }
        }
        const bikes = [new Cycle('#00e5ff'), new Cycle('#00e5ff'), new Cycle('#ff6d00'), new Cycle('#ff6d00'), new Cycle('#00e5ff')];
        function animate() { const scrollY = window.scrollY; ctx.clearRect(0, 0, width, height); bikes.forEach(b => { b.update(scrollY); b.draw(ctx, scrollY); }); requestAnimationFrame(animate); } animate();
    }

    window.onload = function initApp() { buildGenreSelectors(); initGridAnimation(); };

    function buildGenreSelectors() {
        const grid = document.getElementById('genreSelectorGrid'); const filterDropdown = document.getElementById('filterGenre'); grid.innerHTML = '';
        Object.keys(GENRES_MAP).forEach(genre => {
            const label = document.createElement('label'); label.className = 'genre-checkbox-label'; label.style.color = GENRES_MAP[genre];
            label.innerHTML = `<input type="checkbox" name="genres" value="${genre}"> ${genre}`; grid.appendChild(label);
            const option = document.createElement('option'); option.value = genre; option.textContent = genre; filterDropdown.appendChild(option);
        });
    }

    // --- AGGIORNAMENTO DINAMICO SELETTORE RAGGRUPPATORI ---
    function updateGroupSelectOptions() {
        const select = document.getElementById('movieGroupSelect');
        if(!select) return;
        select.innerHTML = '<option value="">// Nessun Raggruppatore (Resta nel Mainframe Generale)</option>';

        // Estrae solo i raggruppatori dal DB unificato
        const collections = window.moviesDB.filter(m => m.isCollection === true);
        collections.forEach(coll => {
            const opt = document.createElement('option');
            opt.value = coll.id;
            opt.textContent = coll.title;
            select.appendChild(opt);
        });
    }

    // --- LOGICA GESTIONE VISTE E SWITCH INTERFACCIA ---
    window.switchView = function(viewName) {
        document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));

        const targetView = document.getElementById(`section-${viewName}`);
        if(targetView) targetView.classList.add('active');

        const tab = document.getElementById(`tab-${viewName}`);
        if(tab) tab.classList.add('active');

        const nav = document.getElementById('mainNav');
        if(viewName === 'catalog' || viewName === 'add') {
            nav.style.display = 'table';
        } else {
            nav.style.display = 'none'; // Nasconde la barra superiore nelle view di dettaglio
        }

        if(viewName === 'add') {
            updateGroupSelectOptions();
        }

        window.scrollTo(0, 0);
    }

    window.goBackFromDetail = function() {
        if(lastViewForDetail === 'collection') switchView('collection-view');
        else switchView('catalog');
    }

    // --- FORM: LOGICA DINAMICA PER I RAGGRUPPATORI ---
    window.toggleFormFields = function() {
        const type = document.getElementById('itemType').value;
        const movieFieldsTop = document.getElementById('blockYear');
        const movieFieldsMid = document.getElementById('movieOnlyFields');
        const movieGroupSelectContainer = document.getElementById('movieGroupSelectContainer');
        const movieFieldsBot = document.getElementById('movieOnlyFieldsBottom');
        const lblSpecs = document.getElementById('lblSpecs');
        const specsInput = document.getElementById('movieSpecs');

        if (type === 'collection') {
            movieFieldsTop.style.display = 'none';
            movieFieldsMid.style.display = 'none';
            movieGroupSelectContainer.style.display = 'none';
            movieFieldsBot.style.display = 'none';
            lblSpecs.innerText = "Descrizione Raggruppatore";
            lblSpecs.style.color = "var(--accent-green)";
            specsInput.placeholder = "Breve descrizione del contenuto del raggruppatore...";
        } else {
            movieFieldsTop.style.display = 'block';
            movieFieldsMid.style.display = 'block';
            movieGroupSelectContainer.style.display = 'block';
            movieFieldsBot.style.display = 'block';
            lblSpecs.innerText = "Specifiche Tecniche / Nerd Info";
            lblSpecs.style.color = "var(--accent-cyan)";
            specsInput.placeholder = "Es. 4K HDR, Aspect Ratio IMAX...";
        }
    }

    function resetForm() {
        editingId = null; editingTimestampAdded = null; rawImage = null;
        document.getElementById('cropperUI').style.display = 'none'; pCtx.clearRect(0,0,CANVAS_WIDTH,CANVAS_HEIGHT);

        document.getElementById('itemType').value = 'movie'; toggleFormFields();

        ['movieTitle', 'movieYear', 'movieDirector', 'movieActors', 'movieSpecs', 'moviePlot', 'movieNotes', 'movieCover'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('movieFormat').value = 'Blu-ray';
        document.getElementById('movieGroupSelect').value = '';

        document.querySelectorAll('input[name="genres"]:checked').forEach(cb => cb.checked = false); currentBase64Cover = "";

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.innerText = "Sincronizza nel Core"; submitBtn.style.borderColor = "var(--accent-orange)"; submitBtn.style.color = "var(--accent-orange)";
        document.getElementById('cancelBtn').style.display = 'none'; submitBtn.disabled = false;
    }

    window.cancelEdit = function() { resetForm(); switchView('catalog'); }

    // --- SALVATAGGIO CLOUD ---
    window.saveMovie = async function() {
        const titleInput = document.getElementById('movieTitle').value.trim();
        const type = document.getElementById('itemType').value;
        const isCollection = (type === 'collection');

        if (!titleInput) { alert('ERRORE: Identificativo del titolo obbligatorio.'); return; }

        const now = Date.now();
        let movieData = {
            title: titleInput,
            isCollection: isCollection,
            specs: document.getElementById('movieSpecs').value.trim() || 'N/A',
            cover: currentBase64Cover || null,
            timestampAdded: editingId !== null ? (editingTimestampAdded || now) : now,
            timestampModified: now
        };

        if (isCollection) {
            movieData.format = 'Collection';
            // Svuota i campi non pertinenti per pulizia nel database
            movieData.genres = []; movieData.year = ''; movieData.director = ''; movieData.actors = ''; movieData.plot = ''; movieData.notes = ''; movieData.groupId = '';
        } else {
            movieData.format = document.getElementById('movieFormat').value;
            movieData.groupId = document.getElementById('movieGroupSelect').value; // Registrazione del gruppo di appartenenza
            movieData.genres = Array.from(document.querySelectorAll('input[name="genres"]:checked')).map(cb => cb.value);
            movieData.year = document.getElementById('movieYear').value.trim() || 'N/A';
            movieData.director = document.getElementById('movieDirector').value.trim() || 'Sconosciuto';
            movieData.actors = document.getElementById('movieActors').value.trim() || 'N/A';
            movieData.plot = document.getElementById('moviePlot').value.trim() || 'Nessun dato di trama registrato nel Mainframe.';
            movieData.notes = document.getElementById('movieNotes').value.trim() || 'Nessuna coordinata interna';
        }

        const btn = document.getElementById('submitBtn'); btn.innerText = "Sincronizzazione Uplink in corso..."; btn.disabled = true;

        if(window.saveToFirebase) await window.saveToFirebase(movieData, editingId);
        else console.error("Modulo Firebase non allineato.");

        resetForm(); switchView('catalog');
    }

    // --- MODIFICA ELEMENTI (Film e Raggruppatori) ---
    window.editMovie = function(id, e) {
        if(e) e.stopPropagation();
        const movie = window.moviesDB.find(m => m.id === id); if(!movie) return;

        updateGroupSelectOptions(); // Carica le opzioni prima di selezionarla

        document.getElementById('itemType').value = movie.isCollection ? 'collection' : 'movie';
        toggleFormFields();

        document.getElementById('movieTitle').value = movie.title;
        document.getElementById('movieSpecs').value = movie.specs || '';

        if (!movie.isCollection) {
            document.getElementById('movieFormat').value = movie.format;
            document.getElementById('movieGroupSelect').value = movie.groupId || '';
            document.getElementById('movieYear').value = movie.year || '';
            document.getElementById('movieDirector').value = movie.director || '';
            document.getElementById('movieActors').value = movie.actors || '';
            document.getElementById('moviePlot').value = movie.plot || '';
            document.getElementById('movieNotes').value = movie.notes || '';
            document.querySelectorAll('input[name="genres"]').forEach(cb => { cb.checked = (movie.genres || []).includes(cb.value); });
        }

        currentBase64Cover = movie.cover || "";
        if (currentBase64Cover) {
            const img = new Image(); img.onload = () => {
                rawImage = img; document.getElementById('cropperUI').style.display = 'block'; cropX = 0; cropY = 0;
                minScale = Math.max(CANVAS_WIDTH / rawImage.width, CANVAS_HEIGHT / rawImage.height); currentScale = minScale;
                scaledW = rawImage.width * currentScale; scaledH = rawImage.height * currentScale;
                cropX = (CANVAS_WIDTH - scaledW) / 2; cropY = (CANVAS_HEIGHT - scaledH) / 2; renderCrop();
            }; img.src = currentBase64Cover;
        } else { document.getElementById('cropperUI').style.display = 'none'; }

        editingId = movie.id; editingTimestampAdded = movie.timestampAdded || Date.now();
        const submitBtn = document.getElementById('submitBtn'); submitBtn.innerText = "Sovrascrivi Dati nel Core"; submitBtn.style.borderColor = "var(--accent-cyan)"; submitBtn.style.color = "var(--accent-cyan)"; document.getElementById('cancelBtn').style.display = 'block';
        switchView('add');
    }

    window.deleteMovie = async function(id, e) {
        if(e) e.stopPropagation();

        const isCollection = window.moviesDB.find(m => m.id === id)?.isCollection;
        const alertMsg = isCollection
            ? "ELIMINAZIONE RAGGRUPPATORE: I film all'interno non verranno cancellati, ma torneranno visibili come singoli e liberi nel Mainframe. Procedere?"
            : "ELIMINAZIONE DEFINITIVA: Procedere con la rimozione del flusso dati dal Core Remoto?";

        if(confirm(alertMsg)) {
            // Se stiamo eliminando un raggruppatore, rimuoviamo l'associazione da tutti i film che lo contenevano
            if (isCollection) {
                const linkedMovies = window.moviesDB.filter(m => m.groupId === id);
                for(let m of linkedMovies) {
                    m.groupId = "";
                    if(window.saveToFirebase) await window.saveToFirebase(m, m.id, false); // false = evita lag di ricarica
                }
            }
            if(window.deleteFromFirebase) await window.deleteFromFirebase(id);
        }
    }

    // --- COSTRUTTORE GRAFICO PER SCHEDE FILM E RAGGRUPPATORI ---
    function createCardElement(movie, context = 'catalog', delayIndex = 0) {
        const card = document.createElement('div');
        let cardClass = movie.isCollection ? "collection" : (movie.format ? movie.format.toLowerCase() : 'blu-ray');
        card.className = `movie-card ${cardClass}`;

        if (context === 'collection') {
            card.classList.add('stagger-card');
            card.style.animationDelay = `${delayIndex * 0.1}s`;
        }

        let onClickAction = movie.isCollection ? `showCollectionDetail('${movie.id}')` : `showMovieDetail('${movie.id}', '${context}')`;
        card.setAttribute('onclick', onClickAction);

        let coverHTML = `<div class="cover-display">[ No Matrix Data ]</div>`;
        if(movie.cover) coverHTML = `<img src="${movie.cover}" class="cover-display" alt="Cover">`;

        let genresHTML = '<div class="genres-container">';
        if (!movie.isCollection && movie.genres) {
            movie.genres.forEach(g => { genresHTML += `<span class="genre-tag" style="color: ${GENRES_MAP[g] || 'var(--text-neon)'};">${g}</span> `; });
        }
        genresHTML += '</div>';

        let meta = movie.isCollection ? `<span style="color: var(--accent-green); letter-spacing:1px; font-weight:bold;">[ RAGGRUPPATORE ]</span>` : `${movie.year || ''} | ${movie.director || ''}`;

        card.innerHTML = `
            <div class="card-actions">
                <button class="icon-btn edit-btn" onclick="editMovie('${movie.id}', event)">✎</button>
                <button class="icon-btn delete-btn" onclick="deleteMovie('${movie.id}', event)">&times;</button>
            </div>
            ${coverHTML}
            <div class="card-info">
                <div>
                    <div class="movie-title">${movie.title}</div>
                    <div class="movie-meta-short">${meta}</div>
                    ${genresHTML}
                </div>
            </div>
        `;
        return card;
    }

    window.renderMovies = function() {
        const grid = document.getElementById('movieGrid'); grid.innerHTML = '';
        const qTitle = document.getElementById('searchBar').value.toLowerCase();
        const qDir = document.getElementById('filterDirector').value.toLowerCase();
        const qAct = document.getElementById('filterActors').value.toLowerCase();
        const qYear = document.getElementById('filterYear').value.toLowerCase();
        const qSpecs = document.getElementById('filterSpecs').value.toLowerCase();
        const fFormat = document.getElementById('filterFormat').value;
        const fGenre = document.getElementById('filterGenre').value;
        const sortCriteria = document.getElementById('sortCriteria').value;
        const sortDirection = document.getElementById('sortDirection').value;

        let filteredMovies = window.moviesDB.filter(movie => {
            const matchTitle = movie.title.toLowerCase().includes(qTitle);
            const matchDir = (movie.director || "").toLowerCase().includes(qDir);
            const matchAct = (movie.actors || "").toLowerCase().includes(qAct);
            const matchYear = (movie.year || "").toLowerCase().includes(qYear);
            const matchSpecs = (movie.specs || "").toLowerCase().includes(qSpecs);
            const matchFormat = (fFormat === 'ALL' || (movie.isCollection && fFormat === 'Collection') || (!movie.isCollection && movie.format === fFormat));
            const matchGenre = (fGenre === 'ALL' || (movie.genres && movie.genres.includes(fGenre)));
            return matchTitle && matchDir && matchAct && matchYear && matchSpecs && matchFormat && matchGenre;
        });

        filteredMovies.sort((a, b) => {
            let valA, valB;
            if (sortCriteria === 'alpha') { valA = a.title.toLowerCase(); valB = b.title.toLowerCase(); if (valA < valB) return sortDirection === 'asc' ? -1 : 1; if (valA > valB) return sortDirection === 'asc' ? 1 : -1; return 0; }
            else if (sortCriteria === 'added') { valA = a.timestampAdded || 0; valB = b.timestampAdded || 0; return sortDirection === 'asc' ? valA - valB : valB - valA; }
            else if (sortCriteria === 'modified') { valA = a.timestampModified || 0; valB = b.timestampModified || 0; return sortDirection === 'asc' ? valA - valB : valB - valA; }
        });

        filteredMovies.forEach(movie => { grid.appendChild(createCardElement(movie, 'catalog')); });
    }

    // --- VISUALE DETTAGLIO RAGGRUPPATORE (COLLEZIONE) ---
    window.showCollectionDetail = function(id) {
        const coll = window.moviesDB.find(m => m.id === id); if(!coll) return;
        currentCollectionId = id;

        let coverHTML = coll.cover ? `<img src="${coll.cover}" class="detail-cover" alt="Cover">` : `<div class="detail-cover" style="height:400px; background:#05080f; display:flex; align-items:center; justify-content:center; color:var(--text-dark);">[ NO VISUAL DATA ]</div>`;

        const header = document.getElementById('collectionHeaderContent');
        header.innerHTML = `
            <div class="detail-header collection-header" style="margin-bottom:0;">
                ${coverHTML}
                <div class="detail-title-overlay">
                    <h2 class="detail-title" style="color:var(--accent-green)">${coll.title}</h2>
                    <p style="color:#fff; margin-top:8px; font-size:0.9rem;">${coll.specs || 'Nessuna descrizione'}</p>
                </div>
            </div>
        `;

        const grid = document.getElementById('collectionMoviesGrid'); grid.innerHTML = '';

        // Estrai tutti i film che hanno questo raggruppatore registrato in groupId
        let members = window.moviesDB.filter(m => m.groupId === id);

        // Ordina alfabeticamente per fluidità visiva
        members.sort((a,b) => a.title.toLowerCase().localeCompare(b.title.toLowerCase()));

        members.forEach((m, index) => { grid.appendChild(createCardElement(m, 'collection', index)); });

        switchView('collection-view');
    }

    // --- LOGICA GESTIONE CONTENUTI RAGGRUPPATORE (Aggiungi/Rimuovi con Ricerca) ---
    window.openManageCollection = function() {
        if(!currentCollectionId) return;

        // Carica in memoria i film attualmente associati al gruppo
        tempGroupMembers = window.moviesDB.filter(m => m.groupId === currentCollectionId).map(m => m.id);

        document.getElementById('groupMovieSearch').value = '';
        renderGroupMoviesManagement();
        switchView('manage-collection');
    }

    window.toggleMovieTempStatus = function(movieId) {
        const index = tempGroupMembers.indexOf(movieId);
        if (index > -1) {
            tempGroupMembers.splice(index, 1);
        } else {
            tempGroupMembers.push(movieId);
        }
        renderGroupMoviesManagement(); // Re-renderizza il pannello per aggiornare i tasti colorati
    }

    window.renderGroupMoviesManagement = function() {
        const listDiv = document.getElementById('manageCollectionList');
        listDiv.innerHTML = '';
        const searchFilter = document.getElementById('groupMovieSearch').value.toLowerCase();

        let allMovies = window.moviesDB.filter(m => !m.isCollection && m.title.toLowerCase().includes(searchFilter));
        allMovies.sort((a,b) => a.title.toLowerCase().localeCompare(b.title.toLowerCase()));

        if(allMovies.length === 0) {
            listDiv.innerHTML = '<div style="color: var(--text-dark); text-align: center; padding: 15px;">Nessun flusso isolato corrispondente.</div>';
            return;
        }

        allMovies.forEach(m => {
            const isSelected = tempGroupMembers.includes(m.id);
            const btnColor = isSelected ? 'var(--accent-orange)' : 'var(--accent-cyan)';
            const btnText = isSelected ? 'RIMUOVI' : 'AGGIUNGI';

            listDiv.innerHTML += `
                <div style="display:flex; align-items:center; justify-content:space-between; background:var(--surface-card); padding:10px; border:1px solid var(--accent-vector); margin-bottom:5px;">
                    <span style="color:#fff; font-size:0.95rem; display:flex; flex-direction:column;">
                        <span style="font-weight:bold;">${m.title}</span>
                        <span style="color:var(--text-dark); font-size:0.75rem;">${m.year || 'N/A'} - ${m.director || ''}</span>
                    </span>
                    <button class="btn-action" style="width:auto; padding:5px 15px; margin:0; font-size:0.75rem; border-color:${btnColor}; color:${btnColor};" onclick="toggleMovieTempStatus('${m.id}')">${btnText}</button>
                </div>
            `;
        });
    }

    window.saveCollectionMembers = async function() {
        const btn = document.getElementById('saveCollectionBtn'); btn.innerText = "Salvataggio nel Core..."; btn.disabled = true;

        // Loop attraverso i film esistenti per aggiornare l'appartenenza a questo gruppo
        for(let m of window.moviesDB) {
            if (m.isCollection) continue;

            let changed = false;
            if (tempGroupMembers.includes(m.id) && m.groupId !== currentCollectionId) {
                m.groupId = currentCollectionId; // Assegna al gruppo
                changed = true;
            } else if (!tempGroupMembers.includes(m.id) && m.groupId === currentCollectionId) {
                m.groupId = ""; // Rimuove dal gruppo
                changed = true;
            }

            if (changed && window.saveToFirebase) {
                await window.saveToFirebase(m, m.id, false); // false = evita ricarica pagina in massa
            }
        }

        // Forza il reload generale alla fine dell'operazione
        if(window.loadFromFirebase) await window.loadFromFirebase();

        btn.innerText = "Salva Configurazione Raggruppatore"; btn.disabled = false;
        showCollectionDetail(currentCollectionId); // Torna alla visuale del gruppo
    }

    // --- VISUALE DETTAGLIO FILM SINGOLO ---
    window.showMovieDetail = function(id, context = 'catalog') {
        const m = window.moviesDB.find(movie => movie.id === id); if(!m) return;
        lastViewForDetail = context;

        let coverHTML = m.cover ? `<img src="${m.cover}" class="detail-cover" alt="Cover">` : `<div class="detail-cover" style="height:480px; background:#05080f; display:flex; align-items:center; justify-content:center; color:var(--text-dark);">[ NO VISUAL DATA ]</div>`;
        let genresHTML = (m.genres || []).map(g => `<span class="genre-tag" style="color: ${GENRES_MAP[g] || '#fff'}; padding: 2px 6px; border: 1px solid ${GENRES_MAP[g]}; border-radius: 3px; margin-right: 5px;">${g}</span>`).join('');

        const content = document.getElementById('detailContent');
        content.innerHTML = `
            <div class="detail-header">
                ${coverHTML}
                <div class="detail-title-overlay">
                    <h2 class="detail-title">${m.title} <span style="font-size:1rem; color:var(--accent-orange);">[${m.year || 'N/A'}]</span></h2>
                    <div style="margin-top: 10px;">${genresHTML}</div>
                </div>
            </div>
            <div style="padding: 20px;">
                <div class="detail-grid">
                    <div>
                        <div class="data-panel plot-panel">
                            <h3>Scansione Flusso (Trama)</h3>
                            <p>${m.plot || '---'}</p>
                        </div>
                    </div>
                    <div>
                        <div class="data-panel">
                            <h3>Supporto Master</h3>
                            <p style="color: ${m.format === 'Blu-ray' ? 'var(--accent-cyan)' : 'var(--accent-orange)'}; font-weight:bold;">${m.format}</p>
                        </div>
                        <div class="data-panel">
                            <h3>Regista Creatore</h3>
                            <p>${m.director || '---'}</p>
                        </div>
                        <div class="data-panel">
                            <h3>Programmi / Attori</h3>
                            <p>${m.actors || '---'}</p>
                        </div>
                        <div class="data-panel">
                            <h3>Specifiche Tech (Nerd Info)</h3>
                            <p style="color: var(--text-dark);">${m.specs || '---'}</p>
                        </div>
                        <div class="data-panel">
                            <h3>Coordinate Scaffale</h3>
                            <p style="color: var(--text-dark);">${m.notes || '---'}</p>
                        </div>
                    </div>
                </div>
            </div>
        `;
        switchView('detail');
    }

    // --- FUNZIONI DI EXPORT / IMPORT ---
    window.exportDatabase = function() {
        if(window.moviesDB.length === 0) return alert("Database vuoto. Nessun cluster da esportare.");
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(window.moviesDB));
        const downloadAnchor = document.createElement('a'); downloadAnchor.setAttribute("href", dataStr); downloadAnchor.setAttribute("download", "grid_archive_master_backup.json"); document.body.appendChild(downloadAnchor); downloadAnchor.click(); downloadAnchor.remove();
    }

    window.importDatabase = async function(input) {
        const file = input.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = async function(e) {
            try {
                const imported = JSON.parse(e.target.result);
                if (Array.isArray(imported)) {
                    if(confirm(`Attenzione: iniezione multipla nel Core Firebase. Procedere?`)) {
                        for(let movie of imported) {
                            delete movie.id;
                            if(window.saveToFirebase) await window.saveToFirebase(movie, null, false);
                        }
                        if(window.loadFromFirebase) await window.loadFromFirebase();
                        alert("Iniezione Dati nel Core completata con successo.");
                    }
                }
            } catch (err) { alert("ERRORE JSON: Disco dati corrotto o non compatibile."); }
        }; reader.readAsText(file);
    }
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCkHylWkeYkv-8O_gF9Ge7yW1DSC2dfc0I",
      authDomain: "the-grid---core-archive.firebaseapp.com",
      projectId: "the-grid---core-archive",
      storageBucket: "the-grid---core-archive.firebasestorage.app",
      messagingSenderId: "108411615934",
      appId: "1:108411615934:web:934f582699fe60878ebcef"
    };

    const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);

    enableIndexedDbPersistence(db).catch((err) => {
        if (err.code == 'failed-precondition') console.log('La persistenza funziona solo su una singola scheda aperta.');
        else if (err.code == 'unimplemented') console.log('Browser non supportato per la persistenza offline.');
    });

    window.loadFromFirebase = async () => {
        try {
            const querySnapshot = await getDocs(collection(db, "movies"));
            window.moviesDB = querySnapshot.docs.map(documento => {
                let data = documento.data(); data.id = documento.id; return data;
            });
            if(window.renderMovies) window.renderMovies();
        } catch (e) { console.error("Anomalia nel recupero del Core:", e); }
    };

    window.saveToFirebase = async (movieData, id, autoReload = true) => {
        try {
            if (id) await updateDoc(doc(db, "movies", id), movieData);
            else await addDoc(collection(db, "movies"), movieData);
            if (autoReload) await window.loadFromFirebase();
        } catch (e) { console.error("Anomalia Sincronizzazione:", e); alert("Errore critico di sincronizzazione col Core Remoto."); }
    };

    window.deleteFromFirebase = async (id) => {
        try { await deleteDoc(doc(db, "movies", id)); await window.loadFromFirebase(); } catch (e) { console.error("Anomalia Eliminazione:", e); }
    };

    const loginScreen = document.getElementById('login-screen'); const loginBtn = document.getElementById('login-btn');
    const emailInput = document.getElementById('login-email'); const passwordInput = document.getElementById('login-password');
    const errorText = document.getElementById('login-error');

    loginBtn.addEventListener('click', () => {
      errorText.textContent = "Verifica credenziali in corso...";
      signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value)
        .then(() => { errorText.textContent = ""; emailInput.value = ""; passwordInput.value = ""; })
        .catch((error) => { errorText.textContent = "Accesso negato. Credenziali non valide."; console.error(error.message); });
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginScreen.style.opacity = '0'; setTimeout(() => { loginScreen.style.display = 'none'; }, 500);
        window.loadFromFirebase();
      } else {
        loginScreen.style.display = 'flex'; loginScreen.style.opacity = '1'; window.moviesDB = []; if(window.renderMovies) window.renderMovies();
      }
    });
</script>
